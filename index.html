<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保險判決（2017年起）</title>
    <meta name="description" content="保險判決（2017年起）">
    <meta property="og:title" content="保險判決（2017年起）">
    <meta property="og:description" content="保險判決（2017年起）">
    <style>
        :root {
            --bg-page: #f3f5f8;
            --bg-card: #ffffff;
            --navy-dark: #0f2942;
            --navy-mid: #1e4268;
            --accent-blue: #2563eb;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --win-color: #059669;
            --win-bg: #ecfdf5;
            --partial-color: #d97706;
            --partial-bg: #fffbeb;
            --lose-color: #dc2626;
            --lose-bg: #fef2f2;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            padding: 22px 16px 96px;
        }
        .wrapper { max-width: 1240px; margin: 0 auto; }

        .hero-banner {
            background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-mid) 100%);
            color: #ffffff;
            border-radius: 16px;
            padding: 26px 28px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
            box-shadow: 0 10px 25px rgba(15, 41, 66, 0.14);
        }
        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.14);
            color: #bae6fd;
            font-size: 0.78em;
            font-weight: 600;
            letter-spacing: 0.06em;
            padding: 4px 11px;
            border-radius: 20px;
            margin-bottom: 8px;
        }
        .hero-banner h1 { margin: 0 0 6px 0; font-size: 1.75em; letter-spacing: 0.02em; }
        .hero-banner p { margin: 0; color: #cbd5e1; font-size: 0.94em; }
        .hero-stat-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 12px 20px;
            text-align: right;
            backdrop-filter: blur(6px);
        }
        .total-number { font-size: 1.95em; font-weight: 800; color: #fbbf24; line-height: 1.1; }
        .total-label { font-size: 0.82em; color: #e2e8f0; margin-top: 3px; }

        .control-deck {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 2px 10px rgba(15, 41, 66, 0.04);
        }
        .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .search-bar {
            flex: 1;
            min-width: 240px;
            padding: 11px 16px;
            border-radius: 10px;
            border: 1.5px solid #cbd5e1;
            background-color: #f8fafc;
            color: var(--text-main);
            font-size: 0.98em;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }
        .search-bar:focus { border-color: var(--accent-blue); background-color: #ffffff; }
        .reset-btn {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.18s;
            white-space: nowrap;
        }
        .reset-btn:hover { background-color: #e2e8f0; color: #0f172a; }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
            align-items: center;
        }
        .select-group {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background-color: #f8fafc;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.87em;
            color: var(--text-muted);
            font-weight: 600;
        }
        .select-group select {
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.96em;
            outline: none;
            cursor: pointer;
            max-width: 240px;
        }

        .filter-panel { display: flex; flex-direction: column; gap: 11px; }
        .filter-row { display: flex; align-items: flex-start; gap: 12px; }
        .filter-label { min-width: 68px; color: var(--text-muted); font-size: 0.86em; padding-top: 6px; font-weight: 700; }
        .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
        .chip {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .chip:hover { background-color: #e2e8f0; color: #0f172a; }
        .chip .count { font-size: 0.84em; opacity: 0.72; }
        .chip.active-result { background-color: var(--navy-dark); color: #ffffff; border-color: var(--navy-dark); font-weight: 600; }
        .chip.active-topic { background-color: var(--accent-blue); color: #ffffff; border-color: var(--accent-blue); font-weight: 600; }
        .chip.active-company { background-color: #0f766e; color: #ffffff; border-color: #0f766e; font-weight: 600; }
        .chip.toggle-more { background-color: transparent; border: 1px dashed #94a3b8; color: var(--accent-blue); }

        .stats-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(15, 41, 66, 0.03);
        }
        .stats-numbers { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.92em; margin-bottom: 9px; align-items: center; }
        .stat-win { color: var(--win-color); font-weight: 700; }
        .stat-partial { color: var(--partial-color); font-weight: 700; }
        .stat-lose { color: var(--lose-color); font-weight: 700; }
        .ratio-bar { height: 8px; background-color: #e2e8f0; border-radius: 6px; overflow: hidden; display: flex; }
        .bar-win { background-color: var(--win-color); transition: width 0.3s; }
        .bar-partial { background-color: #f59e0b; transition: width 0.3s; }
        .bar-lose { background-color: var(--lose-color); transition: width 0.3s; }

        .list-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
            font-size: 0.88em;
            color: var(--text-muted);
        }
        .toolbar-actions { display: flex; align-items: center; gap: 10px; }
        .select-page-btn {
            background: #ffffff;
            color: var(--navy-dark);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .select-page-btn:hover { background: #eff6ff; border-color: var(--accent-blue); color: var(--accent-blue); }

        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-light);
            border-left: 4px solid #94a3b8;
            border-radius: 12px;
            padding: 16px 18px;
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, background-color 0.18s;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(15, 41, 66, 0.04);
        }
        .card.border-win-customer { border-left-color: var(--win-color); }
        .card.border-win-partial { border-left-color: #f59e0b; }
        .card.border-win-company { border-left-color: var(--lose-color); }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(15, 41, 66, 0.09); }
        .card.selected {
            background-color: #f8faff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.18);
        }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
        .tag { padding: 3px 9px; border-radius: 6px; font-size: 0.78em; font-weight: 700; }
        .tag.win-customer { background-color: var(--win-bg); color: var(--win-color); border: 1px solid #a7f3d0; }
        .tag.win-partial { background-color: var(--partial-bg); color: var(--partial-color); border: 1px solid #fde68a; }
        .tag.win-company { background-color: var(--lose-bg); color: var(--lose-color); border: 1px solid #fecaca; }
        .tag.topic { background-color: #eff6ff; color: #1d4ed8; font-weight: 600; }
        .tag.year-badge { background-color: #f1f5f9; color: #475569; font-weight: 600; }

        .select-check-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            font-size: 0.78em;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .select-check-label:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
        .select-check-label input { accent-color: var(--accent-blue); width: 15px; height: 15px; cursor: pointer; margin: 0; }

        .company-title { font-size: 1.12em; font-weight: 800; color: var(--navy-dark); line-height: 1.35; }
        .claim-pill {
            display: inline-block;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #0369a1;
            font-size: 0.82em;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            align-self: flex-start;
        }
        .summary {
            font-size: 0.92em;
            line-height: 1.65;
            color: #334155;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8em;
            color: var(--text-muted);
            gap: 8px;
        }
        .read-more { color: var(--accent-blue); font-weight: 700; white-space: nowrap; }
        .no-results { text-align: center; color: var(--text-muted); font-size: 1.02em; grid-column: 1 / -1; padding: 48px 20px; line-height: 1.8; }

        .pagination { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 26px; }
        .page-btn {
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 0.88em;
            min-width: 36px;
            transition: all 0.15s;
        }
        .page-btn:hover:not(:disabled) { background-color: #f1f5f9; border-color: #94a3b8; }
        .page-btn.active { background-color: var(--navy-dark); color: #ffffff; border-color: var(--navy-dark); font-weight: 700; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-ellipsis { color: #94a3b8; padding: 0 4px; }
        .page-jump { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; font-size: 0.86em; color: var(--text-muted); }
        .page-jump input { width: 54px; padding: 5px 8px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; color: var(--text-main); text-align: center; outline: none; }

        .batch-bar {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translate(-50%, 140%);
            background: var(--navy-dark);
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(15, 41, 66, 0.35);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            z-index: 950;
            transition: transform 0.24s ease;
            max-width: calc(100% - 24px);
        }
        .batch-bar.visible { transform: translate(-50%, 0); }
        .batch-info { font-size: 0.92em; font-weight: 700; color: #fbbf24; white-space: nowrap; }
        .batch-btn {
            border: none;
            border-radius: 8px;
            padding: 7px 13px;
            font-size: 0.86em;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
            white-space: nowrap;
        }
        .batch-btn:hover:not(:disabled) { opacity: 0.9; }
        .batch-btn:disabled { opacity: 0.6; cursor: wait; }
        .batch-btn.ghost { background: rgba(255,255,255,0.14); color: #e2e8f0; }
        .batch-btn.primary { background: #10b981; color: #ffffff; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background: #ffffff;
            color: var(--text-main);
            width: 100%;
            max-width: 820px;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 0 26px 26px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.25);
        }
        .modal-actions {
            position: sticky;
            top: 0;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 8px;
            padding: 16px 0 12px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--border-light);
            z-index: 5;
        }
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            border-radius: 8px;
            padding: 7px 13px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 700;
            text-decoration: none;
        }
        .raw-btn { background: var(--win-color); color: #fff; }
        .pick-btn { background: #eff6ff; color: var(--accent-blue); border: 1px solid #bfdbfe; }
        .pick-btn.picked { background: var(--accent-blue); color: #fff; }
        .official-btn { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .copy-btn { background: var(--navy-dark); color: #fff; }
        .close-btn { background: #334155; color: #fff; }

        .modal-meta { color: var(--text-muted); font-size: 0.9em; margin-top: 6px; line-height: 1.6; }
        .amount-badge {
            display: inline-block;
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.92em;
        }
        .summary-box {
            background: #f8fafc;
            border-left: 4px solid var(--accent-blue);
            border-radius: 8px;
            padding: 15px 16px;
            line-height: 1.7;
            margin-top: 14px;
        }
        .modal-section { margin-top: 22px; }
        .modal-section h3 {
            font-size: 1.05em;
            color: var(--navy-dark);
            border-left: 4px solid var(--navy-dark);
            padding-left: 10px;
            margin-bottom: 12px;
        }
        .timeline-item { border-left: 2px solid #cbd5e1; padding-left: 14px; margin-bottom: 12px; }
        .timeline-date { font-weight: 700; color: var(--accent-blue); font-size: 0.9em; }
        .args-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .arg-box { background: #fff; border: 1px solid var(--border-light); border-radius: 10px; overflow: hidden; }
        .arg-header { padding: 9px 14px; color: #fff; font-weight: 700; font-size: 0.93em; }
        .arg-header.customer { background: var(--win-color); }
        .arg-header.company { background: var(--navy-dark); }
        .arg-box ul { margin: 0; padding: 14px 18px 14px 28px; line-height: 1.65; }
        .judgment-list { padding-left: 20px; line-height: 1.7; }
        .judgment-list li { margin-bottom: 8px; }
        .disclaimer { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--border-light); font-size: 0.8em; color: var(--text-muted); line-height: 1.5; }

        @media (max-width: 640px) {
            .hero-banner { padding: 20px; }
            .hero-stat-box { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
            .filter-row { flex-direction: column; gap: 6px; }
            .filter-label { padding-top: 0; }
            .args-grid { grid-template-columns: 1fr; }
            .select-group { width: 100%; justify-content: space-between; }
            .select-group select { max-width: 68%; }
            .modal-content { padding: 0 16px 20px; }
            .modal-actions { justify-content: flex-start; }
            .batch-bar { justify-content: center; padding: 10px 12px; gap: 8px; }
        }
    
        .hero-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
        .advisor-launch-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 13px 18px;
            font-size: 0.95em;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(217, 119, 6, 0.35);
            transition: transform 0.16s, box-shadow 0.16s;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .advisor-launch-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(217, 119, 6, 0.45); }
        .advisor-box { max-width: 880px; }
        .advisor-input-area {
            width: 100%;
            min-height: 118px;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95em;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }
        .advisor-input-area:focus { border-color: var(--accent-blue); }
        .advisor-tools { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .advisor-match-item {
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--win-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #f8fafc;
        }
        .advisor-match-item.lose { border-left-color: var(--lose-color); }
        .advisor-match-item.partial { border-left-color: #f59e0b; }
        .score-pill { background: #dbeafe; color: #1e40af; font-size: 0.78em; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .advisor-tip-box {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.88em;
            margin-top: 10px;
            line-height: 1.55;
        }
    </style>

</head>
<body>

<div class="wrapper">
    <div class="hero-banner">
        <div>
            <div class="hero-badge">INSURANCE JUDGMENT ARCHIVE</div>
            <h1>保險判決（2017年起）</h1>
            <p>全台法院「給付保險金」民事裁判智慧檢索與 AI 匯出平台</p>
        </div>
        <div class="hero-right"><button class="advisor-launch-btn" id="openAdvisorBtn">🤖 理賠個案比對＆溝通建議</button><div class="hero-stat-box">
            <div class="total-number" id="totalCount">0</div>
            <div class="total-label">則收錄判決</div>
        </div></div>
    </div>

    <div class="control-deck">
        <div class="search-row">
            <input type="text" id="searchInput" class="search-bar" placeholder="全文搜尋（空白可隔開多詞）：例如 宏泰 住院、百斯瑞明、癌症 標靶、桃園地院...">
            <button class="reset-btn" id="resetBtn">↺ 重設條件</button>
        </div>

        <div class="controls-bar">
            <label class="select-group">
                <span>裁判年度</span>
                <select id="yearSelect"></select>
            </label>
            <label class="select-group">
                <span>保險公司</span>
                <select id="companySelect"></select>
            </label>
            <label class="select-group">
                <span>排序方式</span>
                <select id="sortSelect">
                    <option value="newest">判決日：最新 → 最舊</option>
                    <option value="oldest">判決日：最舊 → 最新</option>
                </select>
            </label>
            <label class="select-group">
                <span>每頁顯示</span>
                <select id="pageSizeSelect">
                    <option value="20" selected>20 筆</option>
                    <option value="50">50 筆</option>
                </select>
            </label>
        </div>

        <div class="filter-panel" id="filterPanel"></div>
    </div>

    <div class="stats-panel" id="statsPanel"></div>
    <div class="list-toolbar" id="listToolbar"></div>
    <div class="card-container" id="card-container"></div>
    <div class="pagination" id="pagination"></div>
</div>

<div class="batch-bar" id="batchBar">
    <span class="batch-info" id="batchCount">已選取 0 篇</span>
    <button class="batch-btn ghost" id="batchSelectPageBtn">全選本頁</button>
    <button class="batch-btn ghost" id="batchClearBtn">清除選取</button>
    <button class="batch-btn primary" id="batchDownloadBtn">📥 下載判決書（供 AI 分析）</button>
</div>

    <div class="modal-content advisor-box">
        <div class="modal-actions">
            <button class="action-btn close-btn" id="closeAdvisorBtn">✕ 關閉</button>

            輸入或上傳客戶理賠難題，系統將自動從全庫比對最有利判例，並一鍵打包判決全文與 AI 爭取指令（免設定、人人都能直接用）。
        </p>

        <textarea id="advisorIssueInput" class="advisor-input-area" placeholder="請描述客戶遇到的理賠困難，例如：&#10;「保戶投保宏泰人壽實支實付，因鼻中膈彎曲及下鼻甲肥大住院手術，使用自費醫材，保險公司以非必要住院及門診可處理為由拒賠住院醫療金，該如何爭取？」"></textarea>

                <label class="select-page-btn" style="cursor:pointer;">
                    📂 上傳案情文字檔 (.txt)
                    <input type="file" id="advisorFileInput" accept=".txt,.md,.csv" style="display:none;">
                </label>
                <label style="font-size:0.88em;color:#334155;font-weight:600;display:inline-flex;align-items:center;gap:5px;cursor:pointer;">
                    <input type="checkbox" id="preferWinCheck" checked style="accent-color:var(--accent-blue);">
                    優先推薦「保戶勝訴 / 部分勝訴」有利判例
                </label>
            </div>
            <button class="action-btn copy-btn" id="runMatchBtn" style="padding:9px 18px;font-size:0.93em;">🔍 立即比對相關判例</button>

<div class="modal-overlay" id="detailModal">
    <div class="modal-content" id="modalBody"></div>
</div>

<script src="cases.js"></script>
<script>
    const rawData = Array.isArray(window.caseData) ? window.caseData : [];
    const RESULTS_LIST = ["保戶勝訴", "部分勝訴", "保險公司勝"];
    const TOP_TOPIC_LIMIT = 14;
    const TOP_COMPANY_LIMIT = 12;

    const state = {
        search: "",
        result: "all",
        topic: "all",
        company: "all",
        year: "all",
        sort: "newest",
        page: 1,
        pageSize: 20,
        showAllTopics: false,
        selectedIds: new Set()
    };

    let currentPageItems = [];

    const filterPanel = document.getElementById('filterPanel');
    const statsPanel = document.getElementById('statsPanel');
    const listToolbar = document.getElementById('listToolbar');
    const container = document.getElementById('card-container');
    const paginationEl = document.getElementById('pagination');
    const searchInput = document.getElementById('searchInput');
    const resetBtn = document.getElementById('resetBtn');
    const yearSelect = document.getElementById('yearSelect');
    const companySelect = document.getElementById('companySelect');
    const sortSelect = document.getElementById('sortSelect');
    const pageSizeSelect = document.getElementById('pageSizeSelect');
    const totalCount = document.getElementById('totalCount');
    const detailModal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');
    const batchBar = document.getElementById('batchBar');
    const batchCount = document.getElementById('batchCount');
    const batchSelectPageBtn = document.getElementById('batchSelectPageBtn');
    const batchClearBtn = document.getElementById('batchClearBtn');
    const batchDownloadBtn = document.getElementById('batchDownloadBtn');

    function escapeHtml(str) {
        return String(str ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function getResultClass(item) {
        const rc = item.tags?.resultClass;
        if (rc === 'win-customer' || rc === 'win-partial' || rc === 'win-company') return rc;
        const r = item.tags?.result || '';
        if (r.includes('部分')) return 'win-partial';
        if (r.includes('保戶')) return 'win-customer';
        if (r.includes('公司')) return 'win-company';
        return 'win-partial';
    }

    function parseDateMeta(item) {
        const dateStr = String(item.basicInfo?.date || '');
        let m = dateStr.match(/(?:民國\s*)?(\d{2,4})\s*[\/\-\.年]\s*(\d{1,2})\s*[\/\-\.月]\s*(\d{1,2})/);
        if (m) {
            let y = parseInt(m[1], 10);
            const mo = parseInt(m[2], 10);
            const d = parseInt(m[3], 10);
            if (y > 1911) y -= 1911;
            if (y >= 80 && y <= 150) return { year: y, sortKey: y * 10000 + mo * 100 + d };
        }
        const fallbackSrc = `${dateStr} ${item.basicInfo?.caseNumber || ''} ${item.sourceFile || ''}`;
        m = fallbackSrc.match(/(\d{2,3})\s*(?:年度|年)/);
        if (m) {
            const y = parseInt(m[1], 10);
            if (y >= 80 && y <= 150) return { year: y, sortKey: y * 10000 };
        }
        return { year: null, sortKey: 0 };
    }

    const caseMap = new Map();
    const resultCounts = new Map();
    const topicCounts = new Map();
    const companyCounts = new Map();
    const yearCounts = new Map();

    const caseData = rawData.map((item, idx) => {
        const safeId = item.id || `case_idx_${idx}`;
        const dateMeta = parseDateMeta(item);
        const resultLabel = item.tags?.result || '未分類';
        const resultClass = getResultClass(item);
        const topics = Array.isArray(item.tags?.topics) ? item.tags.topics.filter(Boolean) : [];
        const company = (item.basicInfo?.insuranceCompany || '').trim();

        resultCounts.set(resultLabel, (resultCounts.get(resultLabel) || 0) + 1);
        topics.forEach(t => topicCounts.set(t, (topicCounts.get(t) || 0) + 1));
        if (company) companyCounts.set(company, (companyCounts.get(company) || 0) + 1);
        if (dateMeta.year) yearCounts.set(dateMeta.year, (yearCounts.get(dateMeta.year) || 0) + 1);

        const timelineText = (item.content?.timeline || []).map(t => `${t.date || ''} ${t.event || ''}`).join(' ');
        const custArgs = (item.content?.arguments?.customer || []).join(' ');
        const compArgs = (item.content?.arguments?.company || []).join(' ');
        const judgText = (item.content?.judgment || []).join(' ');

        const searchText = [
            item.basicInfo?.court, company, item.basicInfo?.insuranceType,
            item.basicInfo?.caseNumber, item.basicInfo?.date, item.basicInfo?.claimInfo,
            resultLabel, ...topics, ...(item.tags?.keywords || []),
            item.content?.summary, timelineText, custArgs, compArgs, judgText
        ].filter(Boolean).join(' ').toLowerCase();

        const enriched = {
            ...item,
            id: safeId,
            _result: resultLabel,
            _resultClass: resultClass,
            _topics: topics,
            _company: company,
            _year: dateMeta.year,
            _sortKey: dateMeta.sortKey,
            _searchText: searchText
        };
        caseMap.set(safeId, enriched);
        return enriched;
    });

    const sortedTopics = [...topicCounts.entries()].sort((a, b) => b[1] - a[1]);
    const sortedCompanies = [...companyCounts.entries()].sort((a, b) => b[1] - a[1]);
    const sortedYears = [...yearCounts.entries()].sort((a, b) => b[0] - a[0]);

    totalCount.textContent = caseData.length.toLocaleString();

    function initDropdowns() {
        yearSelect.innerHTML = `<option value="all">全部年度 (${caseData.length} 筆)</option>` +
            sortedYears.map(([y, cnt]) => `<option value="${y}">民國 ${y} 年 (${cnt} 筆)</option>`).join('');
        companySelect.innerHTML = `<option value="all">全部保險公司 (共 ${sortedCompanies.length} 家)</option>` +
            sortedCompanies.map(([name, cnt]) => `<option value="${escapeHtml(name)}">${escapeHtml(name)} (${cnt})</option>`).join('');
    }

    function updateBatchBar() {
        const count = state.selectedIds.size;
        batchCount.textContent = `已選取 ${count} 篇判決`;
        if (count > 0) batchBar.classList.add('visible');
        else batchBar.classList.remove('visible');

        const allPageSelected = currentPageItems.length > 0 && currentPageItems.every(it => state.selectedIds.has(it.id));
        const labelText = allPageSelected ? "☑ 取消全選本頁" : "☑️ 全選本頁";
        batchSelectPageBtn.textContent = labelText;
        const topBtn = document.getElementById('topSelectPageBtn');
        if (topBtn) topBtn.textContent = labelText;
    }

    function toggleSelectId(id, forceVal) {
        const nextVal = typeof forceVal === 'boolean' ? forceVal : !state.selectedIds.has(id);
        if (nextVal) state.selectedIds.add(id);
        else state.selectedIds.delete(id);

        const cardEl = container.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
        if (cardEl) {
            cardEl.classList.toggle('selected', nextVal);
            const cb = cardEl.querySelector('.case-checkbox');
            if (cb) cb.checked = nextVal;
        }
        updateBatchBar();
    }

    function toggleSelectCurrentPage() {
        if (currentPageItems.length === 0) return;
        const allSelected = currentPageItems.every(it => state.selectedIds.has(it.id));
        currentPageItems.forEach(it => {
            if (allSelected) state.selectedIds.delete(it.id);
            else state.selectedIds.add(it.id);
        });
        renderAll();
    }

    function renderFilters() {
        const buildChips = (type, entries, activeClass, totalAll, extraBtn = "") => {
            const allActive = state[type] === "all" ? activeClass : "";
            let html = `<button class="chip ${allActive}" data-type="${type}" data-value="all">全部 <span class="count">${totalAll}</span></button>`;
            entries.forEach(([val, cnt]) => {
                const isActive = state[type] === val ? activeClass : "";
                html += `<button class="chip ${isActive}" data-type="${type}" data-value="${escapeHtml(val)}">${escapeHtml(val)} <span class="count">${cnt}</span></button>`;
            });
            return html + extraBtn;
        };

        const resultEntries = RESULTS_LIST.map(r => [r, resultCounts.get(r) || 0]);
        const visibleTopics = state.showAllTopics ? sortedTopics : sortedTopics.slice(0, TOP_TOPIC_LIMIT);
        if (!state.showAllTopics && state.topic !== "all" && !visibleTopics.some(([t]) => t === state.topic)) {
            visibleTopics.push([state.topic, topicCounts.get(state.topic) || 0]);
        }
        const topicToggleBtn = sortedTopics.length > TOP_TOPIC_LIMIT
            ? `<button class="chip toggle-more" data-action="toggle-topics">${state.showAllTopics ? "▲ 收合主題" : `＋ 展開全部 ${sortedTopics.length} 個主題`}</button>`
            : "";

        const visibleCompanies = sortedCompanies.slice(0, TOP_COMPANY_LIMIT);
        if (state.company !== "all" && !visibleCompanies.some(([c]) => c === state.company)) {
            visibleCompanies.push([state.company, companyCounts.get(state.company) || 0]);
        }
        const compHint = sortedCompanies.length > TOP_COMPANY_LIMIT
            ? `<span style="font-size:0.8em;color:#94a3b8;padding:6px 4px;">（其餘請用上方「保險公司」下拉選單）</span>`
            : "";

        filterPanel.innerHTML = `
            <div class="filter-row">
                <div class="filter-label">勝負結果</div>
                <div class="filter-chips">${buildChips("result", resultEntries, "active-result", caseData.length)}</div>
            </div>
            <div class="filter-row">
                <div class="filter-label">爭議主題</div>
                <div class="filter-chips">${buildChips("topic", visibleTopics, "active-topic", caseData.length, topicToggleBtn)}</div>
            </div>
            <div class="filter-row">
                <div class="filter-label">熱門公司</div>
                <div class="filter-chips">${buildChips("company", visibleCompanies, "active-company", caseData.length, compHint)}</div>
            </div>
        `;
    }

    function renderPagination(totalItems, totalPages) {
        if (totalPages <= 1) { paginationEl.innerHTML = ""; return; }
        const cur = state.page;
        const pages = new Set([1, totalPages, cur - 2, cur - 1, cur, cur + 1, cur + 2]);
        const validPages = [...pages].filter(p => p >= 1 && p <= totalPages).sort((a, b) => a - b);

        let html = `<button class="page-btn" data-page="${cur - 1}" ${cur <= 1 ? 'disabled' : ''}>← 上一頁</button>`;
        let prev = 0;
        validPages.forEach(p => {
            if (prev && p - prev > 1) html += `<span class="page-ellipsis">…</span>`;
            html += `<button class="page-btn ${p === cur ? 'active' : ''}" data-page="${p}">${p}</button>`;
            prev = p;
        });
        html += `<button class="page-btn" data-page="${cur + 1}" ${cur >= totalPages ? 'disabled' : ''}>下一頁 →</button>`;
        html += `<span class="page-jump">跳至第 <input type="number" id="jumpPageInput" min="1" max="${totalPages}" value="${cur}"> / ${totalPages} 頁 <button class="page-btn" id="jumpPageBtn">前往</button></span>`;
        paginationEl.innerHTML = html;
    }

    function renderAll() {
        renderFilters();
        yearSelect.value = state.year;
        companySelect.value = state.company;
        sortSelect.value = state.sort;
        pageSizeSelect.value = String(state.pageSize);

        if (caseData.length === 0) {
            statsPanel.style.display = 'none';
            listToolbar.innerHTML = '';
            paginationEl.innerHTML = '';
            currentPageItems = [];
            container.innerHTML = '<div class="no-results">目前資料庫還沒有判決資料。</div>';
            updateBatchBar();
            return;
        }
        statsPanel.style.display = 'block';

        const keywords = state.search.trim().toLowerCase().split(/\s+/).filter(Boolean);
        const targetYear = state.year === "all" ? null : parseInt(state.year, 10);

        const baseMatched = caseData.filter(item => {
            if (targetYear !== null && item._year !== targetYear) return false;
            if (state.topic !== "all" && !item._topics.includes(state.topic)) return false;
            if (state.company !== "all" && item._company !== state.company) return false;
            if (keywords.length > 0 && !keywords.every(kw => item._searchText.includes(kw))) return false;
            return true;
        });

        const totalBase = baseMatched.length;
        let winCnt = 0, partialCnt = 0, loseCnt = 0;
        baseMatched.forEach(i => {
            if (i._result === "保戶勝訴") winCnt++;
            else if (i._result === "部分勝訴") partialCnt++;
            else if (i._result === "保險公司勝") loseCnt++;
        });

        const pct = n => totalBase === 0 ? 0 : Math.round((n / totalBase) * 100);
        const winPct = pct(winCnt), partialPct = pct(partialCnt), losePct = pct(loseCnt);

        statsPanel.innerHTML = `
            <div class="stats-numbers">
                <span>目前條件共 <strong>${totalBase.toLocaleString()}</strong> 筆判決：</span>
                <span class="stat-win">保戶勝訴 ${winCnt.toLocaleString()} 筆 (${winPct}%)</span>
                <span class="stat-partial">部分勝訴 ${partialCnt.toLocaleString()} 筆 (${partialPct}%)</span>
                <span class="stat-lose">保險公司勝 ${loseCnt.toLocaleString()} 筆 (${losePct}%)</span>
            </div>
            <div class="ratio-bar">
                <div class="bar-win" style="width:${winPct}%"></div>
                <div class="bar-partial" style="width:${partialPct}%"></div>
                <div class="bar-lose" style="width:${losePct}%"></div>
            </div>
        `;

        const finalList = state.result === "all" ? baseMatched.slice() : baseMatched.filter(item => item._result === state.result);
        finalList.sort((a, b) => state.sort === "oldest" ? a._sortKey - b._sortKey : b._sortKey - a._sortKey);

        const totalFiltered = finalList.length;
        if (totalFiltered === 0) {
            listToolbar.innerHTML = '';
            paginationEl.innerHTML = '';
            currentPageItems = [];
            container.innerHTML = '<div class="no-results">找不到符合目前組合條件的判決，可以按上方「↺ 重設條件」重新查詢。</div>';
            updateBatchBar();
            return;
        }

        const totalPages = Math.max(1, Math.ceil(totalFiltered / state.pageSize));
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;

        const startIdx = (state.page - 1) * state.pageSize;
        const endIdx = Math.min(startIdx + state.pageSize, totalFiltered);
        currentPageItems = finalList.slice(startIdx, endIdx);

        listToolbar.innerHTML = `
            <span>顯示第 <strong>${(startIdx + 1).toLocaleString()}–${endIdx.toLocaleString()}</strong> 筆（共 <strong>${totalFiltered.toLocaleString()}</strong> 筆符合）</span>
            <div class="toolbar-actions">
                <button class="select-page-btn" id="topSelectPageBtn">☑️ 全選本頁</button>
                <span>第 <strong>${state.page}</strong> / ${totalPages} 頁</span>
            </div>
        `;
        document.getElementById('topSelectPageBtn').addEventListener('click', toggleSelectCurrentPage);

        container.innerHTML = currentPageItems.map(item => {
            const isChecked = state.selectedIds.has(item.id);
            const topicTags = item._topics.map(t => `<span class="tag topic">${escapeHtml(t)}</span>`).join('');
            const yearBadge = item._year ? `<span class="tag year-badge">民國 ${item._year} 年</span>` : '';
            const claimHTML = item.basicInfo?.claimInfo ? `<div class="claim-pill">${escapeHtml(item.basicInfo.claimInfo)}</div>` : '';
            return `
                <div class="card border-${item._resultClass} ${isChecked ? 'selected' : ''}" data-id="${escapeHtml(item.id)}">
                    <div class="card-top">
                        <div class="tags">
                            <span class="tag ${item._resultClass}">${escapeHtml(item._result)}</span>
                            ${yearBadge}
                            ${topicTags}
                        </div>
                        <label class="select-check-label" title="勾選以加入下載清單">
                            <input type="checkbox" class="case-checkbox" data-id="${escapeHtml(item.id)}" ${isChecked ? 'checked' : ''}>
                            <span>選取</span>
                        </label>
                    </div>
                    <div class="company-title">${escapeHtml(item._company || '保險公司')}｜${escapeHtml(item._topics[0] || '理賠爭議')}</div>
                    ${claimHTML}
                    <div class="summary">${escapeHtml(item.content?.summary || '')}</div>
                    <div class="card-footer">
                        <span>${escapeHtml(item.basicInfo?.court || '')} ${escapeHtml(item.basicInfo?.caseNumber || '')}</span>
                        <span class="read-more">看完整解析 →</span>
                    </div>
                </div>
            `;
        }).join('');

        renderPagination(totalFiltered, totalPages);
        updateBatchBar();
    }

    function extractCleanTextFromHtml(htmlString) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlString, 'text/html');
        doc.querySelectorAll('script, style, .topbar').forEach(el => el.remove());
        doc.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
        doc.querySelectorAll('p, div, h1, h2, h3, h4, li, tr').forEach(el => {
            el.insertAdjacentText('afterend', '\n');
        });
        return (doc.body.textContent || '')
            .replace(/\r\n/g, '\n')
            .replace(/[ \t]+\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();
    }

    async function downloadSelectedJudgments() {
        const ids = [...state.selectedIds];
        if (ids.length === 0) return;

        const origText = batchDownloadBtn.textContent;
        batchDownloadBtn.disabled = true;

        try {
            const sections = [];
            for (let i = 0; i < ids.length; i++) {
                const item = caseMap.get(ids[i]);
                if (!item) continue;
                batchDownloadBtn.textContent = `⏳ 正在整理判決書 (${i + 1}/${ids.length})...`;

                const b = item.basicInfo || {};
                const header = [
                    `====================================================================`,
                    `【案件 ${i + 1} / ${ids.length}】${b.insuranceCompany || ''}｜${b.court || ''} ${b.caseNumber || ''}`,
                    `裁判日期：${b.date || ''}｜險種：${b.insuranceType || ''}｜判決結果：${item._result}`,
                    b.claimInfo ? `理賠金額：${b.claimInfo}` : '',
                    item._topics.length ? `爭議主題：${item._topics.join('、')}` : '',
                    ``,
                    `【AI 白話摘要】`,
                    item.content?.summary || '',
                    `--------------------------------------------------------------------`,
                    `【判決書全文】`
                ].filter(line => line !== '').join('\n');

                let fullText = '';
                if (item.sourceFile) {
                    try {
                        const res = await fetch(`raw_html/${encodeURIComponent(item.id)}.html`);
                        if (res.ok) {
                            const rawHtml = await res.text();
                            fullText = extractCleanTextFromHtml(rawHtml);
                        }
                    } catch (e) {}
                }
                if (!fullText) {
                    const jList = (item.content?.judgment || []).map((j, idx) => `${idx + 1}. ${j}`).join('\n');
                    fullText = `（原文檔案載入受限，以下為結構化重點）\n${jList}`;
                }

                sections.push(`${header}\n${fullText}`);
            }

            const now = new Date();
            const stamp = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
            const intro = `台灣保險金民事判決匯出檔（共 ${sections.length} 篇）\n匯出時間：${now.toLocaleString('zh-TW')}\n提示：可直接將本檔案上傳至 Gemini 或 ChatGPT 進行跨案比較與法理討論。\n\n`;
            const blob = new Blob([intro + sections.join('\n\n\n')], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `保險判決匯出_共${sections.length}篇_${stamp}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            batchDownloadBtn.textContent = `✅ 已下載 ${sections.length} 篇判決書！`;
            setTimeout(() => { batchDownloadBtn.textContent = origText; }, 2200);
        } finally {
            batchDownloadBtn.disabled = false;
        }
    }

    function buildCopyText(item) {
        const b = item.basicInfo || {};
        const jList = (item.content?.judgment || []).map((j, i) => `${i + 1}. ${j}`).join('\n');
        return [
            `【保險判決摘要】${b.insuranceCompany || ''}（${item._result}）`,
            `案號：${b.court || ''} ${b.caseNumber || ''}`,
            `判決日：${b.date || ''}｜險種：${b.insuranceType || ''}`,
            b.claimInfo ? `理賠金額：${b.claimInfo}` : '',
            item._topics.length ? `爭議主題：${item._topics.join('、')}` : '',
            '',
            `【白話摘要】`,
            item.content?.summary || '',
            '',
            `【法院核心見解】`,
            jList
        ].filter(line => line !== null && line !== undefined).join('\n').replace(/\n{3,}/g, '\n\n');
    }

    function copyTextFallback(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).catch(() => copyTextFallback(text));
        } else {
            copyTextFallback(text);
        }
    }

    const advisorModal = document.getElementById('advisorModal');
    const advisorIssueInput = document.getElementById('advisorIssueInput');
    const advisorFileInput = document.getElementById('advisorFileInput');
    const preferWinCheck = document.getElementById('preferWinCheck');
    const advisorResultsArea = document.getElementById('advisorResultsArea');
    let advisorMatchedCases = [];

    const knownCompanies = [...companyCounts.keys()].filter(k => k.length >= 2);
    const knownTopics = [...topicCounts.keys()].filter(k => k.length >= 2);
    const knownKeywords = new Set();
    caseData.forEach(c => (c.tags?.keywords || []).forEach(kw => { if (kw && kw.length >= 2) knownKeywords.add(kw.trim()); }));
    const keywordList = [...knownKeywords];
    const STOP_WORDS = new Set(["保險", "理賠", "公司", "保戶", "申請", "問題", "請問", "如果", "如何", "爭取", "可以", "遇到", "困難", "相關", "判決", "原因", "理由", "拒賠", "他們", "我們", "進行", "以及", "因為", "所以"]);

    function extractTokens(text) {
        const tokens = new Set();
        const clean = text.replace(/[^\u4e00-\u9fffa-zA-Z0-9]/g, " ");
        clean.split(/\s+/).forEach(part => {
            if (!part) return;
            if (/^[a-zA-Z0-9]{2,}$/.test(part)) { tokens.add(part.toLowerCase()); return; }
            for (let len = 2; len <= 3; len++) {
                for (let i = 0; i <= part.length - len; i++) {
                    const gram = part.slice(i, i + len);
                    if (!STOP_WORDS.has(gram)) tokens.add(gram);
                }
            }
        });
        return [...tokens];
    }

    function matchCasesForClaim(issueText, preferWin) {
        const qLower = issueText.toLowerCase();
        const matchedCompanies = knownCompanies.filter(c => issueText.includes(c) || (c.length >= 4 && issueText.includes(c.slice(0, 2))));
        const matchedTopics = knownTopics.filter(t => issueText.includes(t));
        const matchedKws = keywordList.filter(k => qLower.includes(k.toLowerCase()));
        const grams = extractTokens(issueText);

        const scored = [];
        for (const item of caseData) {
            let score = 0;
            const reasons = [];
            if (matchedCompanies.some(mc => item._company && item._company.includes(mc.slice(0, 2)))) {
                score += 35;
                reasons.push(`同公司（${item._company}）`);
            }
            matchedTopics.forEach(t => {
                if (item._topics.includes(t)) { score += 22; reasons.push(t); }
            });
            matchedKws.forEach(k => {
                if (item._searchText.includes(k.toLowerCase())) { score += 16; reasons.push(k); }
            });
            let gramHits = 0;
            for (const g of grams) {
                if (item._searchText.includes(g)) {
                    score += g.length >= 3 ? 6 : 3;
                    gramHits++;
                }
            }
            if (score === 0 && gramHits === 0) continue;
            if (preferWin) {
                if (item._result === "保戶勝訴") score += 20;
                else if (item._result === "部分勝訴") score += 12;
            }
            scored.push({ item, score, reasons: [...new Set(reasons)].slice(0, 4) });
        }
        scored.sort((a, b) => b.score - a.score || b.item._sortKey - a.item._sortKey);
        return scored.slice(0, 6);
    }

    async function buildAdvisorPromptBundle(issueText, selectedItems) {
        const caseBlocks = [];
        for (let i = 0; i < selectedItems.length; i++) {
            const it = selectedItems[i];
            const b = it.basicInfo || {};
            let fullTxt = "";
            if (it.sourceFile) {
                try {
                    const r = await fetch(`raw_html/${encodeURIComponent(it.id)}.html`);
                    if (r.ok) fullTxt = extractCleanTextFromHtml(await r.text()).slice(0, 8000);
                } catch (e) {}
            }
            const jList = (it.content?.judgment || []).join("；");
            caseBlocks.push(
                `【參考判例 ${i + 1}】${b.insuranceCompany || ""}｜${b.court || ""} ${b.caseNumber || ""}（${it._result}）\n` +
                `險種與金額：${b.insuranceType || ""}｜${b.claimInfo || ""}\n` +
                `白話摘要：${it.content?.summary || ""}\n` +
                `法院核心理由：${jList}\n` +
                (fullTxt ? `判決書全文：\n${fullTxt}` : "")
            );
        }

        return (
            `你現在是一位擁有 20 年實務經驗的台灣保險理賠法務顧問與申訴談判專家。\n` +
            `我目前正在協助保戶處理一項理賠爭議，請根據下方的【客戶理賠狀況】以及系統從台灣法院判決庫比對出的【相關歷史判決】，為我擬定一套專業、具體且合法合規的「理賠爭取策略與溝通建議」。\n\n` +
            `====================\n【客戶理賠狀況與困難】\n${issueText.trim()}\n====================\n\n` +
            `【系統比對之相關法院判決】\n${caseBlocks.join("\n\n------------------------------------\n\n")}\n\n` +
            `====================\n請依序為我輸出以下 4 個部分：\n` +
            `1. 【爭議焦點與突破口分析】：指出保險公司抗辯的薄弱處，以及對保戶最有利的法理或契約解釋方向。\n` +
            `2. 【可引用的勝訴判決見解】：整理上述參考判例中，法院支持保戶的具體理由與字號，方便在申訴書或溝通時引用。\n` +
            `3. 【建議補充舉證清單】：具體列出還需要請醫師開立什麼診斷內容、病歷記載或收據明細，才能強化理賠依據。\n` +
            `4. 【給理賠人員的專業溝通話術】：提供一段不卑不亢、有理有據的電話溝通與書面申訴說帖範本。`
        );
    }


    function renderAdvisorResults() {
        const issueText = advisorIssueInput.value.trim();
        if (!issueText) {
            advisorResultsArea.innerHTML = `<div style="color:#dc2626;font-weight:600;">請先輸入或上傳客戶的理賠問題描述喔！</div>`;
            return;
        }
        advisorMatchedCases = matchCasesForClaim(issueText, preferWinCheck.checked);
        if (advisorMatchedCases.length === 0) {
            advisorResultsArea.innerHTML = `<div style="color:#64748b;padding:16px;background:#f8fafc;border-radius:10px;">暫時沒有比對到高度相符的判例，建議補充「險種（如實支實付、意外險）」、「疾病或手術名稱」或「保險公司名稱」再試一次！</div>`;
            return;
        }

        const listHtml = advisorMatchedCases.map((m, idx) => {
            const it = m.item;
            const b = it.basicInfo || {};
            const cls = it._result === "保戶勝訴" ? "" : (it._result === "部分勝訴" ? "partial" : "lose");
            const tagsHtml = m.reasons.map(r => `<span class="score-pill">${escapeHtml(r)}</span>`).join(" ");
            return `
                <div class="advisor-match-item ${cls}">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">
                        <div>
                            <label style="font-weight:800;color:var(--navy-dark);cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
                                <input type="checkbox" class="advisor-case-chk" data-idx="${idx}" ${idx < 3 ? "checked" : ""} style="accent-color:var(--accent-blue);width:16px;height:16px;">
                                <span class="tag ${it._resultClass}">${escapeHtml(it._result)}</span>
                                <span>${escapeHtml(b.insuranceCompany || "")}｜${escapeHtml(b.court || "")} ${escapeHtml(b.caseNumber || "")}</span>
                            </label>
                        </div>
                        <div style="display:flex;gap:5px;flex-wrap:wrap;">${tagsHtml}</div>
                    </div>
                    <div style="font-size:0.88em;color:#334155;margin-top:6px;line-height:1.55;">${escapeHtml(it.content?.summary || "")}</div>
                    <div style="margin-top:6px;font-size:0.82em;">
                        <a href="raw_html/${encodeURIComponent(it.id)}.html" target="_blank" rel="noopener" style="color:var(--accent-blue);font-weight:700;text-decoration:none;">📄 檢視判決原文 ↗</a>
                    </div>
                </div>
            `;
        }).join("");

        advisorResultsArea.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
                <strong style="color:var(--navy-dark);">🎯 為您比對出 ${advisorMatchedCases.length} 篇最相關判例（預設勾選前 3 篇，可自由增減）：</strong>
            </div>
            ${listHtml}
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border-light);">
                <button class="action-btn raw-btn" id="copyAdvisorPromptBtn" style="padding:11px 18px;font-size:0.95em;">📋 一鍵複製「案情＋精選判決書＋AI 爭取指令」</button>
                <div class="advisor-tip-box">
                    💡 <strong>使用方式：</strong>點擊上方綠色按鈕後，系統已自動把「客戶狀況 ＋ 勾選的判決書全文 ＋ 爭取建議提問指令」複製到剪貼簿；直接打開您的 <strong>Gemini</strong> 或 <strong>ChatGPT</strong> 對話框按貼上送出，就能立刻得到具體爭取策略與溝通話術！
                </div>
            </div>
        `;

        document.getElementById('copyAdvisorPromptBtn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            const checkedIdxs = [...advisorResultsArea.querySelectorAll('.advisor-case-chk:checked')].map(el => parseInt(el.dataset.idx, 10));
            const picked = checkedIdxs.map(i => advisorMatchedCases[i]?.item).filter(Boolean);
            if (picked.length === 0) { alert("請至少勾選 1 篇參考判例！"); return; }
            btn.disabled = true;
            btn.textContent = "⏳ 正在打包判決書原文與指令...";
            try {
                const bundle = await buildAdvisorPromptBundle(issueText, picked);
                copyToClipboard(bundle);
                btn.textContent = "✅ 已複製完整攻防指令包！請貼到 Gemini / ChatGPT";
                setTimeout(() => { btn.textContent = "📋 一鍵複製「案情＋精選判決書＋AI 爭取指令」"; }, 3500);
            } finally {
                btn.disabled = false;
            }
        });
    }

    document.getElementById('openAdvisorBtn').addEventListener('click', () => { advisorModal.style.display = "flex"; });
    document.getElementById('closeAdvisorBtn').addEventListener('click', () => { advisorModal.style.display = "none"; });
    advisorModal.addEventListener('click', (e) => { if (e.target === advisorModal) advisorModal.style.display = "none"; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && advisorModal.style.display === 'flex') advisorModal.style.display = 'none'; });
    advisorFileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];

        reader.onload = () => {
            const content = String(reader.result || "").trim();
            advisorIssueInput.value = advisorIssueInput.value ? `${advisorIssueInput.value}\n\n${content}` : content;
        };
        reader.readAsText(file, "utf-8");
    });
    document.getElementById('runMatchBtn').addEventListener('click', renderAdvisorResults);

    initDropdowns();
    renderAll();
</script>
